<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="digitaloceanapp: DigitalOcean tools and workflows for your AI assistant">
  <defs>
    <linearGradient id="bg-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="0.55" stop-color="#e8f1ff"/>
      <stop offset="1" stop-color="#d9ecff"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#2f8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="link-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ba6e0"/>
      <stop offset="1" stop-color="#3a7bff"/>
    </linearGradient>
    <linearGradient id="wave-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a8dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3a8dff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots-l" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3a7bff" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg-l)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots-l)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow-l)"/>

  <path d="M0 330 C 180 300, 340 360, 520 330 S 860 300, 1040 330 S 1220 350, 1280 335 L1280 400 L0 400 Z" fill="url(#wave-l)"/>
  <path d="M0 355 C 200 330, 380 385, 580 355 S 900 330, 1100 355 S 1240 370, 1280 360 L1280 400 L0 400 Z" fill="#3a8dff" fill-opacity="0.08"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#0b1f44" font-size="64" font-weight="700" letter-spacing="-1.5">digitaloceanapp</text>
    <text x="74" y="200" fill="#2f5596" font-size="26" font-weight="500">DigitalOcean tools and workflows for your AI assistant</text>

    <g font-size="17" font-weight="600">
      <rect x="74" y="236" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.7" stroke="#3a7bff" stroke-opacity="0.35"/>
      <text x="149" y="261" fill="#1b3a73" text-anchor="middle">15 skills</text>
      <rect x="236" y="236" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.7" stroke="#3a7bff" stroke-opacity="0.35"/>
      <text x="321" y="261" fill="#1b3a73" text-anchor="middle">11 client targets</text>
      <rect x="418" y="236" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.7" stroke="#3a7bff" stroke-opacity="0.35"/>
      <text x="493" y="261" fill="#1b3a73" text-anchor="middle">21 services</text>
      <rect x="580" y="236" width="128" height="38" rx="19" fill="#ffffff" fill-opacity="0.7" stroke="#3a7bff" stroke-opacity="0.35"/>
      <text x="644" y="261" fill="#1b3a73" text-anchor="middle">No backend</text>
    </g>
  </g>

  <!-- assistant chat bubble -->
  <g transform="translate(800 92)">
    <rect width="190" height="118" rx="20" fill="#ffffff" stroke="#1ba6e0" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M36 118 L30 146 L62 118 Z" fill="#ffffff" stroke="#1ba6e0" stroke-opacity="0.6" stroke-width="2" stroke-linejoin="round"/>
    <rect x="36" y="114" width="28" height="8" fill="#ffffff"/>
    <rect x="24" y="28" width="120" height="10" rx="5" fill="#1ba6e0" fill-opacity="0.85"/>
    <rect x="24" y="52" width="142" height="10" rx="5" fill="#3a7bff" fill-opacity="0.3"/>
    <rect x="24" y="76" width="96" height="10" rx="5" fill="#3a7bff" fill-opacity="0.3"/>
  </g>

  <!-- connection -->
  <path d="M990 150 C 1030 150, 1040 210, 1080 210" fill="none" stroke="url(#link-l)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="990" cy="150" r="6" fill="#1ba6e0"/>
  <circle cx="1080" cy="210" r="6" fill="#3a7bff"/>

  <!-- infrastructure stack -->
  <g transform="translate(1086 132)">
    <g>
      <rect width="130" height="40" rx="10" fill="#ffffff" stroke="#3a7bff" stroke-opacity="0.35"/>
      <circle cx="22" cy="20" r="6" fill="#4ade80"/>
      <rect x="40" y="15" width="70" height="10" rx="5" fill="#3a7bff" fill-opacity="0.35"/>
    </g>
    <g transform="translate(0 52)">
      <rect width="130" height="40" rx="10" fill="#ffffff" stroke="#3a7bff" stroke-opacity="0.35"/>
      <circle cx="22" cy="20" r="6" fill="#4ade80"/>
      <rect x="40" y="15" width="56" height="10" rx="5" fill="#3a7bff" fill-opacity="0.35"/>
    </g>
    <g transform="translate(0 104)">
      <rect width="130" height="40" rx="10" fill="#ffffff" stroke="#3a7bff" stroke-opacity="0.35"/>
      <circle cx="22" cy="20" r="6" fill="#fbbf24"/>
      <rect x="40" y="15" width="78" height="10" rx="5" fill="#3a7bff" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
